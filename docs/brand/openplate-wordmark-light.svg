<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" width="520" height="96" role="img" aria-label="OpenPlate">
  <g transform="translate(8,16)">  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1f6feb"/>
  <!-- silicon with an etched trench -->
  <path d="M10 26 H24 V48 H40 V26 H54 V54 H10 Z" fill="#dbe7fb"/>
  <!-- conformal copper film -->
  <path d="M10 18 H30 V40 H34 V18 H54 V26 H40 V48 H24 V26 H10 Z" fill="#e08a4a"/>
  <path d="M10 18 H30 V40 H34 V18 H54" fill="none" stroke="#ffd2ad" stroke-width="1.5" stroke-linejoin="round"/>
</g>
  <text x="88" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#1b1f24">Open<tspan fill="#1f6feb">Plate</tspan></text>
  <text x="90" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6570">Open-source copper electroplating simulator</text>
</svg>
